# Tests du client c360 sur les trois systèmes, à chaque mise à jour du dépôt.
# Le serveur de Studio 360D est simulé dans le test (tests/client.test.mjs) : aucun secret ici.
name: Tests du client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=spec 2>&1 | tee resultats-tests.txt
      # Les journaux de GitHub ne se lisent qu'avec un compte : en cas d'échec, le détail part
      # aussi en annotation, lisible par l'API publique (check-runs/<id>/annotations).
      - name: Détail des échecs en annotation
        if: failure()
        shell: bash
        run: |
          msg=$(sed -n '/failing tests:/,$p' resultats-tests.txt | head -120 | cut -c1-300)
          [ -n "$msg" ] || msg=$(tail -80 resultats-tests.txt | cut -c1-300)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Tests en échec (${{ matrix.os }}, Node ${{ matrix.node }})::${msg}"
